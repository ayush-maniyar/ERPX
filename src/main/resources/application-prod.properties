# Production database: PostgreSQL. Activate with SPRING_PROFILES_ACTIVE=prod
# (requires a running Postgres instance reachable at the configured URL).
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD:YOUR_PASSWORD_HERE}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
