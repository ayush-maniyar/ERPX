# Server configuration
server.port=8080

# Active profile: 'local' uses an embedded H2 file database (zero external
# services required). Switch to 'prod' (or set SPRING_PROFILES_ACTIVE=prod)
# to use PostgreSQL instead — see application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT Configuration
# jwt.secret must be a Base64-encoded key of at least 256 bits (32 bytes) for HS256.
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:CHANGE_ME_32_BYTE_MINIMUM_BASE64_SECRET_VALUE_HERE}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Gmail SMTP Configuration
# Use a Google App Password (not your account password): https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:YOUR_GMAIL_ADDRESS_HERE}
spring.mail.password=${GMAIL_APP_PASSWORD:YOUR_APP_PASSWORD_HERE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
