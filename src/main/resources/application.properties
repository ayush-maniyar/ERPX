# Server configuration
server.port=8080

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD:YOUR_PASSWORD_HERE}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings (Tells Spring to automatically create database tables for us)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect