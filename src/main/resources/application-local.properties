# Local development database: embedded H2, file-backed so data survives restarts.
# No external database service needs to be installed or running.
spring.datasource.url=jdbc:h2:file:./data/erp_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Optional web console for inspecting local data at /h2-console (local dev only).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
